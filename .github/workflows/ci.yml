name: Template CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '25'
          cache: 'gradle'
      - name: Build
        run: ./gradlew check

  verify-ddl:
    name: Verify DDL pipeline output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated DDL and migrations are in agreement
        run: ./scripts/generate-migration.sh --verify
