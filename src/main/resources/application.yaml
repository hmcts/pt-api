server:
  port: 4550
  shutdown: "graceful"

security:
  anonymousPaths:
    - "/health"
    - "/health/liveness"
    - "/health/readiness"
    - "/swagger-ui.html"
    - "/swagger-ui/**"
    - "/v3/api-docs/**"

testing-support:
  enabled: ${ENABLE_TESTING_SUPPORT:false}

ccd:
  decentralised-runtime:
    retain-and-dispose:
      # off | dry_run | live. dry_run logs what would be removed without removing it.
      mode: ${RETAIN_AND_DISPOSE_MODE:off}
      system-user:
        username: ${PT_IDAM_SYSTEM_USERNAME:pt-system-user@localhost}
        password: ${PT_IDAM_SYSTEM_PASSWORD:password}

# If you use a database then uncomment the `group:, readiness: and include: "db"` lines in the health probes and uncomment the datasource section
management:
  endpoint:
    health:
      show-details: "always"
      # group:
      #  readiness:
      #   include: "db"
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus
  health:
    elasticsearch:
      enabled: false

springdoc:
  packagesToScan: uk.gov.hmcts.reform.pt
  writer-with-order-by-keys: true

spring:
  config:
    import: "optional:configtree:/mnt/secrets/pt-kv1/"
  application:
    name: pt api
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PT_DB_HOST:localhost}:${DB_PORT:5432}/${PT_DB_NAME:pt}${PT_DB_OPTIONS:}
    username: ${PT_DB_USER_NAME:postgres}
    password: ${PT_DB_PASSWORD:}
    properties:
      charSet: UTF-8
#    hikari:
#      minimumIdle: 2
#      maximumPoolSize: 10
#      idleTimeout: 10000
#      poolName: PtHikariCP
#      maxLifetime: 7200000
#      connectionTimeout: 30000
  jpa:
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        # Load lazy associations for up to this many owners per query instead of one at a time.
        # ApplicationMapper walks caseParty and ptCase and then several of their collections, so
        # without this each one costs a separate select per case.
        default_batch_fetch_size: 25
#      hibernate:
#        dialect: org.hibernate.dialect.PostgreSQLDialect
#        format_sql: true
#        show-sql: ${SPRING_JPA_SHOW_SQL:false}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          prd-admin:
            provider: idam
            client-id: ${IDAM_CLIENT_ID:pt-api}
            client-secret: ${IDAM_CLIENT_SECRET:dummy-secret-for-local}
            client-authentication-method: client_secret_post
            authorization-grant-type: password
            scope: openid,profile,roles
          system-user:
            provider: idam
            client-id: ${IDAM_CLIENT_ID:pt-api}
            client-secret: ${IDAM_CLIENT_SECRET:dummy-secret-for-local}
            client-authentication-method: client_secret_post
            authorization-grant-type: password
            scope: openid,profile,roles
        provider:
          idam:
            token-uri: ${IDAM_API_URL:http://localhost:5062}/o/token
  azure:
    application-insights:
      instrumentation-key: ${pt.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}
flyway:
  noop:
    strategy: ${FLYWAY_NOOP_STRATEGY:false}

idam:
  api:
    url: ${IDAM_API_URL:http://localhost:5062}
  client:
    id: ${IDAM_CLIENT_ID:pt-api}
    secret: ${IDAM_CLIENT_SECRET:dummy-secret-for-local}
    redirect_uri: ${IDAM_CLIENT_REDIRECT_URI:http://localhost:3000/oauth2/callback}
  s2s-auth:
    url: ${IDAM_S2S_AUTH_URL:http://localhost:4502}
    totp_secret: ${PT_API_S2S_SECRET:AAAAAAAAAAAAAAAA}
    microservice: ${S2S_SERVICE_NAME:pt_api}
  s2s-authorised:
    services: ${S2S_NAMES_WHITELIST:pt_api,pt_frontend,ccd_data}
  system-user:
    username: ${PT_IDAM_SYSTEM_USERNAME:pt-system-user@localhost}
    password: ${PT_IDAM_SYSTEM_PASSWORD:password}
  throttle:
    # How long (seconds) to tell callers to wait when IDAM throttles us, and which OAuth2
    # error codes count as throttling. Consumed by UpstreamThrottling.
    retry-after-seconds: ${IDAM_THROTTLE_RETRY_AFTER_SECONDS:30}
    oauth2-error-codes: ${IDAM_THROTTLE_OAUTH2_ERROR_CODES:invalid_token_response,temporarily_unavailable}

core_case_data:
  api:
    url: ${CCD_DATA_STORE_URL:localhost:4452}

caseApi:
  url: ${CASE_API_URL:http://localhost:4550}

case_document_am:
  url: ${CASE_DOCUMENT_AM_URL:http://localhost:4455}

send-letter:
  url: ${SEND_LETTER_URL:http://localhost:8485}

db-scheduler:
  enabled: false # This disables the autoconfiguration of DB Scheduler. Always off.
  executor-enabled: ${DB_SCHEDULER_EXECUTOR_ENABLED:true}
  polling-interval-seconds: ${DB_SCHEDULER_POLLING_INTERVAL_SECONDS:10}
  threads: ${DB_SCHEDULER_THREADS:10}

notify:
  api-url: ${NOTIFY_URL:}
  api-key: ${PT_NOTIFY_API_KEY:AAAAAAAA-AAAA-AAAA-AAAA-AAAAAAAAAAAA}
  send-email:
    max-retries: ${NOTIFY_SEND_EMAIL_MAX_RETRIES:5}
    backoff-delay-seconds: ${NOTIFY_SEND_EMAIL_BACKOFF_DELAY_SECONDS:300s}
  check-status:
    max-retries: ${NOTIFY_CHECK_STATUS_MAX_RETRIES:5}
    task-delay-seconds: ${NOTIFY_CHECK_STATUS_DELAY_SECONDS:60s}
    backoff-delay-seconds: ${NOTIFY_CHECK_STATUS_BACKOFF_DELAY_SECONDS:3600s}
  templates:
    test-template: 5f740c1e-2ec5-411d-9291-edc5c6b35060
