security:
  anonymousPaths:
    - "/**"

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

idam:
  system-user:
    username: ${PLACEHOLDER_INTEGRATION_IDAM_USERNAME:pt-system-user-it}
    password: ${PLACEHOLDER_INTEGRATION_IDAM_PASSWORD:pt-system-password-it}

flyway:
  noop:
    strategy: false

logging:
  level:
    uk.gov.hmcts.reform.pt: DEBUG

testing-support:
  enabled: true
