security:
  anonymousPaths:
    - "/"
    - "/health"
    - "/health/liveness"
    - "/health/readiness"
    - "/swagger-ui.html"
    - "/swagger-ui/**"
    - "/v3/api-docs/**"

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: always
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
      dialect: org.hibernate.dialect.PostgreSQLDialect
      format_sql: true
      show-sql: ${SPRING_JPA_SHOW_SQL:false}
    show-sql: true
    properties:
      hibernate:
        hbm2ddl-auto: none
      hibernate.format_sql: true
      show-dql: true

idam:
  system-user:
    username: ${PLACEHOLDER_INTEGRATION_IDAM_USERNAME:pt-system-user-it}
    password: ${PLACEHOLDER_INTEGRATION_IDAM_PASSWORD:pt-system-password-it}

flyway:
  noop:
    strategy: false

logging:
  level:
    uk.gov.hmcts.reform.pt: DEBUG

testing-support:
  enabled: true
